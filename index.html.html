
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>행운의 로또 번호 추첨기</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                 Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #fff8ed);
    color: #17243b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 900px;
    padding: 45px 25px;
    text-align: center;
    background: white;
    border-radius: 28px;
    box-shadow: 0 15px 45px rgba(20, 40, 80, 0.12);
  }

  h1 {
    font-size: clamp(32px, 5vw, 48px);
    margin: 0 0 15px;
    font-weight: 900;
  }

  .subtitle {
    font-size: 23px;
    color: #56647a;
    line-height: 1.6;
    margin-bottom: 35px;
  }

  .balls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    min-height: 125px;
    margin: 35px 0;
  }

  .ball {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 900;
    color: white;
    box-shadow:
      inset -8px -10px 14px rgba(0,0,0,0.17),
      inset 5px 6px 10px rgba(255,255,255,0.3),
      0 6px 12px rgba(0,0,0,0.15);
    transition: transform 0.2s ease;
  }

  .ball:nth-child(1) { background: #e4a900; }
  .ball:nth-child(2) { background: #2476db; }
  .ball:nth-child(3) { background: #e34b4b; }
  .ball:nth-child(4) { background: #626875; }
  .ball:nth-child(5) { background: #22a66c; }
  .ball:nth-child(6) { background: #914cc9; }

  .ball.pop {
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0%   { transform: scale(0.65); opacity: 0.5; }
    65%  { transform: scale(1.13); opacity: 1; }
    100% { transform: scale(1); }
  }

  .buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 25px;
  }

  button {
    min-width: 230px;
    min-height: 82px;
    padding: 18px 28px;
    border: none;
    border-radius: 18px;
    font-size: 29px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    touch-action: manipulation;
  }

  button:active {
    transform: scale(0.96);
  }

  button:focus-visible {
    outline: 4px solid #ffb900;
    outline-offset: 4px;
  }

  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  #drawBtn {
    background: #1757d5;
    color: white;
  }

  #drawBtn:hover:not(:disabled) {
    background: #1044ad;
  }

  #againBtn {
    background: #e9edf4;
    color: #17243b;
  }

  #againBtn:hover:not(:disabled) {
    background: #d8e0ed;
  }

  .status {
    font-size: 25px;
    font-weight: bold;
    min-height: 38px;
    margin-top: 25px;
    color: #2454a5;
  }

  .notice {
    margin-top: 35px;
    font-size: 18px;
    line-height: 1.7;
    color: #687386;
  }

  @media (max-width: 600px) {
    .container {
      padding: 32px 15px;
    }

    .subtitle {
      font-size: 20px;
    }

    .balls {
      gap: 9px;
    }

    .ball {
      width: 78px;
      height: 78px;
      font-size: 33px;
    }

    button {
      width: 100%;
      font-size: 27px;
      min-height: 76px;
    }

    .status {
      font-size: 22px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ball.pop {
      animation: none;
    }
  }
</style>
</head>

<body>

<main class="container">

  <h1>🍀 행운의 로또 번호 추첨기</h1>

  <p class="subtitle">
    오늘의 행운을 만나보세요!<br>
    버튼을 누르면 로또 번호 6개가 나옵니다.
  </p>

  <div class="balls" id="balls" aria-label="로또 번호">
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
  </div>

  <div class="buttons">
    <button id="drawBtn" type="button">
      🎯 번호 뽑기
    </button>

    <button id="againBtn" type="button">
      🔄 다시 뽑기
    </button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">
    번호 뽑기 버튼을 눌러주세요!
  </div>

  <p class="notice">
    1부터 45까지의 숫자 중 중복 없이 6개를 추첨합니다.<br>
    모든 번호는 무작위로 선택되며 당첨을 보장하지 않습니다.
  </p>

</main>

<script>
  "use strict";

  const drawBtn = document.getElementById("drawBtn");
  const againBtn = document.getElementById("againBtn");
  const status = document.getElementById("status");
  const balls = Array.from(
    document.querySelectorAll(".ball")
  );

  let isDrawing = false;

  // 1~45 중 서로 다른 번호 6개 추첨
  function getLottoNumbers() {
    const numbers = Array.from(
      { length: 45 },
      (_, i) => i + 1
    );

    // Fisher-Yates 셔플
    for (let i = numbers.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);

      [numbers[i], numbers[j]] =
        [numbers[j], numbers[i]];
    }

    return numbers.slice(0, 6).sort((a, b) => a - b);
  }

  // 가능하면 브라우저의 보안 난수 생성기 사용
  function randomInt(max) {
    if (window.crypto && window.crypto.getRandomValues) {
      const array = new Uint32Array(1);
      const range = 4294967296;
      const limit = range - (range % max);

      do {
        window.crypto.getRandomValues(array);
      } while (array[0] >= limit);

      return array[0] % max;
    }

    return Math.floor(Math.random() * max);
  }

  function showNumbers(numbers) {
    balls.forEach((ball, index) => {
      ball.classList.remove("pop");
      ball.textContent = numbers[index];
    });
  }

  function startDrawing() {
    if (isDrawing) return;

    isDrawing = true;

    drawBtn.disabled = true;
    againBtn.disabled = true;

    status.textContent = "🍀 행운의 번호를 뽑고 있습니다!";

    balls.forEach(ball => {
      ball.classList.remove("pop");
    });

    // 추첨 도중 숫자가 빠르게 바뀌는 효과
    const animation = setInterval(() => {
      const temporaryNumbers = getLottoNumbers();
      showNumbers(temporaryNumbers);
    }, 65);

    // 약 1.8초 후 최종 번호 확정
    setTimeout(() => {
      clearInterval(animation);

      const finalNumbers = getLottoNumbers();

      showNumbers(finalNumbers);

      // 공이 하나씩 튀어나오는 효과
      balls.forEach((ball, index) => {
        setTimeout(() => {
          ball.classList.add("pop");
        }, index * 110);
      });

      status.textContent = "🎉 추첨 완료! 행운을 빕니다!";

      drawBtn.disabled = false;
      againBtn.disabled = false;

      isDrawing = false;

    }, 1800);
  }

  drawBtn.addEventListener("click", startDrawing);
  againBtn.addEventListener("click", startDrawing);
</script>

</body>
</html>
